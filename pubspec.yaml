name: xfavorites
description: Ứng dụng quản lý danh sách tài khoản X (Twitter) yêu thích, chạy trên Windows và Android từ một codebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.13.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # SQLite cục bộ
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.1

  # Chọn file CSV (file picker)
  file_picker: ^6.1.1

  # Mở link trang cá nhân bằng trình duyệt ngoài ứng dụng
  url_launcher: ^6.2.1

  # Quản lý trạng thái
  flutter_riverpod: ^2.4.9

  # Xử lý ngày tháng, collection helpers
  intl: ^0.20.3
  collection: ^1.18.0

  # Kéo thả file CSV trên Windows/Linux/macOS
  desktop_drop: ^0.9.2

  # Thư viện SQLite native cho desktop (không phụ thuộc sqlite3.dll hệ thống)
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^8.1.4

flutter:
  uses-material-design: true
