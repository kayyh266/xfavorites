name: Build X Favorites

env:
  FLUTTER_VERSION: '3.22.2'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java (Temurin JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Remove old Android project
        shell: bash
        run: rm -rf android

      - name: Create fresh Android project
        run: flutter create --platforms=android .

      - name: Remove default widget test
        shell: bash
        run: rm -f test/widget_test.dart

      - name: Restore custom AndroidManifest.xml permissions
        shell: bash
        run: |
          # Add permissions before </manifest>
          sed -i 's#</manifest>#<!-- Permissions -->\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build full APK (fat APK)
        run: flutter build apk --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xfavorites-android-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  release:
    needs: [android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
